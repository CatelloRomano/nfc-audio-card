<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Per te</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .subtitle {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #71717a;
      margin-bottom: 8px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
      color: #fafafa;
    }
    .play-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #fafafa;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      margin-bottom: 28px;
    }
    .play-btn:active { transform: scale(0.94); }
    .play-btn svg { width: 30px; height: 30px; fill: currentColor; }

    .bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 28px;
      margin-bottom: 24px;
    }
    .bar {
      width: 3px;
      height: 6px;
      background: #52525b;
      border-radius: 2px;
      transition: height 0.2s ease, background 0.2s ease;
    }
    .playing .bar {
      background: #fafafa;
      animation: bounce 0.9s infinite ease-in-out;
    }
    .playing .bar:nth-child(2) { animation-delay: 0.15s; }
    .playing .bar:nth-child(3) { animation-delay: 0.3s; }
    .playing .bar:nth-child(4) { animation-delay: 0.45s; }
    .playing .bar:nth-child(5) { animation-delay: 0.2s; }
    .playing .bar:nth-child(6) { animation-delay: 0.35s; }
    .playing .bar:nth-child(7) { animation-delay: 0.1s; }

    @keyframes bounce {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    .progress-wrap {
      width: 100%;
      height: 4px;
      background: #27272a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .progress {
      width: 0%;
      height: 100%;
      background: #fafafa;
      transition: width 0.1s linear;
    }
    .pills {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .pill {
      background: transparent;
      border: 1px solid #27272a;
      color: #a1a1aa;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .pill.active {
      border-color: #fafafa;
      color: #fafafa;
      background: #18181b;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="subtitle">Nota vocale</div>
    <div class="title" id="trackTitle">Messaggio 01</div>

    <button class="play-btn" id="playBtn" aria-label="Play o Pausa">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="pills" id="pills"></div>
  </div>

  <audio id="player" preload="auto"></audio>

  <script>
    const tracks = [
  { title: "Messaggio 01", src: "audio1.m4a" },
  { title: "Messaggio 02", src: "audio2.m4a" },
  { title: "Messaggio 03", src: "audio3.m4a" }
    ];

    const player = document.getElementById("player");
    const playBtn = document.getElementById("playBtn");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const trackTitle = document.getElementById("trackTitle");
    const progress = document.getElementById("progress");
    const pillsWrap = document.getElementById("pills");
    const card = document.getElementById("card");

    // A ogni scansione passa automaticamente alla traccia successiva
    const last = parseInt(localStorage.getItem("nfc_last_track") ?? "-1", 10);
    let current = (last + 1) % tracks.length;
    localStorage.setItem("nfc_last_track", current);

    function setPlayingUI(isPlaying) {
      iconPlay.style.display = isPlaying ? "none" : "block";
      iconPause.style.display = isPlaying ? "block" : "none";
      card.classList.toggle("playing", isPlaying);
    }

    function loadTrack(index, autoplay = false) {
      current = index;
      player.src = tracks[index].src;
      trackTitle.textContent = tracks[index].title;
      progress.style.width = "0%";
      document.querySelectorAll(".pill").forEach((p, i) => {
        p.classList.toggle("active", i === index);
      });
      if (autoplay) {
        player.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
      } else {
        setPlayingUI(false);
      }
    }

    tracks.forEach((_, i) => {
      const btn = document.createElement("button");
      btn.className = "pill";
      btn.textContent = `0${i + 1}`;
      btn.onclick = () => {
        localStorage.setItem("nfc_last_track", i);
        loadTrack(i, true);
      };
      pillsWrap.appendChild(btn);
    });

    playBtn.onclick = () => {
      if (player.paused) {
        player.play().then(() => setPlayingUI(true));
      } else {
        player.pause();
        setPlayingUI(false);
      }
    };

    player.ontimeupdate = () => {
      if (player.duration) {
        progress.style.width = `${(player.currentTime / player.duration) * 100}%`;
      }
    };

    player.onended = () => {
      setPlayingUI(false);
      progress.style.width = "0%";
    };

    loadTrack(current, false);
  </script>
</body>
</html>
